# =============================================================================
# TEMPLATE: Northform Forge — Playwright CI Workflow
# =============================================================================
# Copy to: .github/workflows/client-[slug]-playwright.yml
#
# Placeholders to update (search "REPLACE"):
#   1. Workflow name          — use client name
#   2. Branch triggers        — match client's branching strategy
#   3. Working directory      — path to client's playwright dir
#   4. Node version           — default 20, change if client requires different
#   5. cache-dependency-path  — must match working directory path
#   6. Secret name            — onboard script generates PLAYWRIGHT_BASE_URL_[SLUG] automatically
#   7. Artifact name          — include client slug to distinguish in GitHub UI
#   8. Artifact path          — must match working directory path
#   9. Multi-browser matrix   — optional: enable Firefox/WebKit (see comment in jobs block)
#
# Required GitHub secret (set in repo Settings → Secrets → Actions):
#   PLAYWRIGHT_BASE_URL_[SLUG] — the base URL of the environment under test.
#   Use a client-namespaced name so multiple clients share the same repo
#   without conflicting secrets (e.g. PLAYWRIGHT_BASE_URL_ACME).
#   The onboard script generates the correct name automatically.
# =============================================================================

name: "[TEMPLATE] Playwright Tests"  # REPLACE: "Client [Name] — Playwright Tests"

on:
  push:
    branches: [main]      # REPLACE: add release branches if client uses them (e.g. develop, staging)
  pull_request:
    branches: [main]      # REPLACE: match push.branches above

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # REPLACE (optional): Multi-browser matrix — disabled by default to conserve free-tier minutes.
    #
    # The default run (Chromium only) costs ~1× minutes per push.
    # Enabling this matrix runs Chromium, Firefox, and WebKit as separate parallel jobs,
    # costing ~3× minutes per push. At 2,000 free minutes/month, a full matrix limits you
    # to roughly 1/3 the number of runs before hitting the cap.
    # Only enable for clients who explicitly require cross-browser coverage.
    #
    # To enable:
    #   1. Uncomment the four lines below (strategy through fail-fast)
    #   2. In "Install Playwright browsers": change 'chromium' to '${{ matrix.browser }}'
    #   3. In "Run Playwright tests":        change '--project=chromium' to '--project=${{ matrix.browser }}'
    #   4. In "Upload test report" name:     change 'chromium' to '${{ matrix.browser }}'
    #   5. If using the publish-report workflow, update its artifact name reference to match
    #
    # strategy:                           # REPLACE (optional): uncomment for multi-browser coverage
    #   matrix:
    #     browser: [chromium, firefox, webkit]
    #   fail-fast: false                  # allow remaining browsers to finish if one fails

    defaults:
      run:
        working-directory: clients/client-SLUG/playwright  # REPLACE: e.g. clients/client-acme/playwright

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20                                                            # REPLACE: if client requires different Node version
          cache: npm
          cache-dependency-path: clients/client-SLUG/playwright/package-lock.json   # REPLACE: match working-directory above

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        # Default: Chromium only. If multi-browser matrix is enabled above,
        # change 'chromium' to '${{ matrix.browser }}'.
        run: npx playwright install --with-deps chromium  # REPLACE (if matrix enabled): '${{ matrix.browser }}'

      - name: Run Playwright tests
        run: npx playwright test --project=chromium  # REPLACE (if matrix enabled): '--project=${{ matrix.browser }}'
        env:
          CI: true
          BASE_URL: ${{ secrets.PLAYWRIGHT_BASE_URL_SLUG }}  # REPLACE: client-namespaced secret generated by onboard script (e.g. PLAYWRIGHT_BASE_URL_ACME)

      - name: Upload test report
        uses: actions/upload-artifact@v4
        if: always()  # Upload on both pass and fail so failures are always diagnosable
        with:
          name: playwright-report-client-SLUG-chromium              # REPLACE: use client slug; if matrix enabled, change 'chromium' to '${{ matrix.browser }}'
          path: clients/client-SLUG/playwright/playwright-report/   # REPLACE: match working-directory above
          retention-days: 30
