# =============================================================================
# TEMPLATE: Northform Forge — API Test Workflow
# =============================================================================
# Copy to: .github/workflows/client-[slug]-api.yml
#
# Placeholders to update (search "REPLACE"):
#   1. Workflow name          — use client name
#   2. Branch triggers        — match client's branching strategy
#   3. Working directory      — path to client's api test dir
#   4. Node version           — default 20
#   5. cache-dependency-path  — must match working directory path
#   6. API_BASE_URL secret    — API_BASE_URL_[SLUG]
#   7. API_AUTH_TOKEN secret  — API_AUTH_TOKEN_[SLUG] (remove if no auth)
#   8. Artifact name          — include client slug
#   9. Artifact path          — must match working directory path
#
# Required GitHub secrets:
#   API_BASE_URL_[SLUG]   — base URL of the API under test
#   API_AUTH_TOKEN_[SLUG] — bearer token for authenticated endpoints (optional)
#   Naming: [TESTTYPE]_[VAR]_[SLUG] (e.g. API_BASE_URL_ACME, API_AUTH_TOKEN_ACME)
# =============================================================================

name: "[TEMPLATE] API Tests"  # REPLACE: "Client [Name] — API Tests"

on:
  push:
    branches: [main]      # REPLACE: match client's branching strategy
  pull_request:
    branches: [main]      # REPLACE: match push.branches above
  workflow_dispatch:

jobs:
  api-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: clients/client-SLUG/api  # REPLACE: e.g. clients/client-acme/api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20                                                         # REPLACE: if client requires different Node version
          cache: npm
          cache-dependency-path: clients/client-SLUG/api/package-lock.json       # REPLACE: match working-directory above

      - name: Install dependencies
        run: npm ci

      - name: Run API tests
        run: npm test
        env:
          API_BASE_URL:   ${{ secrets.API_BASE_URL_SLUG }}                       # REPLACE: e.g. API_BASE_URL_ACME
          API_AUTH_TOKEN: ${{ secrets.API_AUTH_TOKEN_SLUG }}                     # REPLACE: e.g. API_AUTH_TOKEN_ACME — remove if no auth

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-results-client-SLUG                                           # REPLACE: use client slug
          path: clients/client-SLUG/api/test-results/                            # REPLACE: match working-directory above
          retention-days: 30
