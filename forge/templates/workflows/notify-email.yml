# =============================================================================
# TEMPLATE: Northform Forge — Email Failure Notification (Reusable Workflow)
# =============================================================================
# Deploy to: .github/workflows/notify-email.yml (shared — one copy for all clients)
#
# Caller example:
#
#   notify-email:
#     needs: playwright
#     if: failure()
#     uses: ./.github/workflows/notify-email.yml
#     with:
#       client-slug:   northformqa
#       client-name:   "Northform QA"
#       workflow-name: "Client Northformqa — Playwright Tests"
#       run-url:       ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
#     secrets:
#       resend-api-key: ${{ secrets.RESEND_API_KEY }}
#       notify-email:   ${{ secrets.CLIENT_NOTIFY_EMAIL_NORTHFORMQA }}
#
# Required GitHub secrets:
#   RESEND_API_KEY                  — shared Resend API key (one for all clients)
#   CLIENT_NOTIFY_EMAIL_[SLUG]      — recipient email per client
# =============================================================================

on:
  workflow_call:
    inputs:
      client-slug:
        required: true
        type: string
      client-name:
        required: true
        type: string
      workflow-name:
        required: true
        type: string
      run-url:
        required: true
        type: string
    secrets:
      resend-api-key:
        required: true
      notify-email:
        required: true

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Send failure email via Resend
        run: |
          TIMESTAMP=$(date -u "+%B %d, %Y at %H:%M UTC")
          curl -sf -X POST "https://api.resend.com/emails" \
            -H "Authorization: Bearer $RESEND_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{
              "from": "Northform QA <alerts@northformqa.ca>",
              "to": ["'"$NOTIFY_EMAIL"'"],
              "subject": "❌ CI Failure: ${{ inputs.client-name }} — ${{ inputs.workflow-name }}",
              "html": "<p>A test suite failed for <strong>${{ inputs.client-name }}</strong>.</p><p><strong>Workflow:</strong> ${{ inputs.workflow-name }}<br><strong>Time:</strong> '"$TIMESTAMP"'</p><p><a href=\"${{ inputs.run-url }}\">View the failing run on GitHub →</a></p><hr><p style=\"color:#888;font-size:12px\">Northform QA — Automated test alert</p>"
            }'
        env:
          RESEND_API_KEY: ${{ secrets.resend-api-key }}
          NOTIFY_EMAIL:   ${{ secrets.notify-email }}
